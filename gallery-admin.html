<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>תמונות האתר — ניהול</title>
<!-- W-31: העלאת תמונות לגלריית האתר. כניסה במייל (Magic Link) כמו stickers-admin.html.
     ההרשאה האמיתית בשרת: Edge Function site-gallery בודקת ADMIN_EMAILS. כאן רק ממשק. -->
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js?v=1"></script>
<style>
  :root{--navy:#14294D;--indigo:#4338CA;--line:#E5E7EB;--muted:#6B7280;--ok:#0F7B3F;--err:#B91C1C}
  *{box-sizing:border-box}
  body{margin:0;font-family:Heebo,system-ui,sans-serif;background:#F4F5FB;color:#1F2937}
  header{background:var(--navy);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px}
  header h1{font-size:1.15rem;margin:0;flex:1}
  header a{color:#fff;font-size:.9rem}
  main{max-width:900px;margin:0 auto;padding:16px}
  .card{background:#fff;border-radius:14px;padding:16px;box-shadow:0 2px 10px rgba(20,41,77,.07);margin-bottom:14px}
  h2{font-size:1.05rem;margin:0 0 10px;color:var(--navy)}
  label{display:block;font-weight:700;margin:10px 0 4px}
  input[type=email],input[type=text],select{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
  .btn{font:inherit;font-weight:800;border:0;border-radius:999px;padding:12px 20px;cursor:pointer;background:var(--indigo);color:#fff}
  .btn[disabled]{opacity:.5;cursor:default}
  .btn.ghost{background:#fff;color:var(--indigo);border:2px solid var(--indigo)}
  .btn.big{width:100%;font-size:1.1rem;padding:16px}
  .msg{margin-top:8px;font-size:.92rem}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .prev{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:10px}
  .prev figure{margin:0;position:relative;border-radius:10px;overflow:hidden;background:#EEF0FF;aspect-ratio:1}
  .prev img{width:100%;height:100%;object-fit:cover;display:block}
  .prev figcaption{position:absolute;inset:auto 0 0 0;background:rgba(0,0,0,.55);color:#fff;font-size:.72rem;padding:3px 6px}
  .prev .st{position:absolute;top:6px;inset-inline-start:6px;background:#fff;border-radius:999px;font-size:.8rem;padding:1px 7px}
  .bar{height:10px;background:#E5E7EB;border-radius:999px;overflow:hidden;margin-top:10px}
  .bar i{display:block;height:100%;width:0;background:var(--indigo);transition:width .2s}
  .list figure .acts{position:absolute;top:6px;inset-inline-end:6px;display:flex;gap:4px}
  .list figure .acts button{font:inherit;font-size:.75rem;border:0;border-radius:999px;padding:3px 8px;cursor:pointer;background:#fff}
  .list figure.hid img{opacity:.35}
  .hint{color:var(--muted);font-size:.86rem;margin:6px 0 0}
  [hidden]{display:none!important}
</style>
</head>
<body>
<header><h1>📷 תמונות האתר</h1><a href="admin.html">ניהול האתר</a><a href="index.html">לאתר</a></header>
<main>
  <section class="card" id="login">
    <h2>כניסה</h2>
    <label for="email">מייל</label>
    <input type="email" id="email" value="hoshaya@gmail.com" autocomplete="email">
    <div class="row" style="margin-top:10px"><button class="btn" id="send">שלח לי קישור כניסה</button></div>
    <p class="msg" id="login-msg"></p>
  </section>

  <section class="card" id="up" hidden>
    <h2>הוספת תמונות</h2>
    <label for="cat">לאיזו קטגוריה?</label>
    <select id="cat"></select>
    <label for="alt">תיאור קצר (לא חובה — עוזר לגוגל)</label>
    <input type="text" id="alt" placeholder="למשל: קשת בלונים ליום הולדת">
    <div style="margin-top:12px"><button class="btn big" id="pick">📷 בחירת תמונות</button></div>
    <input type="file" id="files" accept="image/*" multiple hidden>
    <p class="hint">כל תמונה נשמרת בשני גדלים: קטנה ומהירה לגלריה, וגדולה וחדה כשלוחצים עליה. התמונות החדשות מופיעות ראשונות.</p>
    <div class="prev" id="prev"></div>
    <div class="bar" id="bar" hidden><i></i></div>
    <div style="margin-top:12px"><button class="btn big" id="go" hidden>⬆️ העלאה לאתר</button></div>
    <p class="msg" id="up-msg"></p>
  </section>

  <section class="card" id="mine" hidden>
    <h2>תמונות שהעלית</h2>
    <p class="hint">"הסתר" מוריד מהאתר ושומר, "מחק" מוחק לגמרי. התמונות הישנות מהדרייב מנוהלות בנפרד.</p>
    <div class="prev list" id="list"></div>
  </section>
</main>
<script>
const CATS=[['events','עיצוב אירועים'],['bar','בר בלונים ודמויות'],['characters','דמויות'],['bar-chars','דמויות של בר בלונים'],['event-chars','דמויות של עיצוב אירועים'],['arch','קשת'],['column','עמוד'],['hoop','חישוק'],['frame','מסגרת'],['numbers','מספרים'],['centerpieces','מרכזי שולחן'],['garlands','גירלנדות'],['hats','כתרים וכובעים'],['rooms','עיצוב חדרים'],['printing','הדפסה על בלונים'],['workshops','סדנאות'],['satisfied','לקוחות מרוצים']];
const CAT_HE=Object.fromEntries(CATS);
const $=id=>document.getElementById(id);
const sb=supabase.createClient(window.SUPABASE_CONFIG.url,window.SUPABASE_CONFIG.anonKey);
const FN=window.SUPABASE_CONFIG.url+'/functions/v1/site-gallery';
const PUB=window.SUPABASE_CONFIG.url+'/storage/v1/object/public/site-gallery/';
let session=null,picked=[];
$('cat').innerHTML=CATS.map(([v,t])=>`<option value="${v}">${t}</option>`).join('');
try{const last=localStorage.getItem('ga_cat');if(last&&CAT_HE[last])$('cat').value=last;}catch(e){}
$('cat').addEventListener('change',()=>{try{localStorage.setItem('ga_cat',$('cat').value);}catch(e){}});

async function api(body){
  const r=await fetch(FN,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+session.access_token},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok||j.error)throw new Error(j.error||('HTTP '+r.status));
  return j;
}
function showApp(on){$('login').hidden=on;$('up').hidden=!on;$('mine').hidden=!on;if(on)loadList();}
sb.auth.getSession().then(({data})=>{session=data.session;showApp(!!session);});
sb.auth.onAuthStateChange((ev,s)=>{session=s;showApp(!!s);});

$('send').addEventListener('click',async()=>{
  const email=$('email').value.trim(),m=$('login-msg');
  $('send').disabled=true;m.style.color='var(--muted)';m.textContent='שולח…';
  const{error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.href.split('#')[0],shouldCreateUser:false}});
  m.style.color=error?'var(--err)':'var(--ok)';
  m.textContent=error?'לא נשלח — בדוק את המייל ונסה שוב':'📩 נשלח קישור למייל. פתח אותו מהמכשיר הזה.';
  $('send').disabled=false;
});

// ── הקטנה בדפדפן: 600 ו-1600 בצד הארוך, webp. תמונה קטנה יותר לא מוגדלת. ──
function loadImage(file){return new Promise((ok,no)=>{const u=URL.createObjectURL(file),i=new Image();i.onload=()=>ok(i);i.onerror=()=>no(new Error('לא תמונה'));i.src=u;});}
function resized(img,max){
  const s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
  const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*s);c.height=Math.round(img.naturalHeight*s);
  const x=c.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(img,0,0,c.width,c.height);
  return new Promise(ok=>c.toBlob(b=>ok(b),'image/webp',max>1000?.86:.8));
}
$('pick').addEventListener('click',()=>$('files').click());
$('files').addEventListener('change',async e=>{
  const fs=[...e.target.files];e.target.value='';
  for(const f of fs){
    try{const img=await loadImage(f);picked.push({img,name:f.name,state:''});}
    catch(err){$('up-msg').style.color='var(--err)';$('up-msg').textContent='קובץ שלא נפתח: '+f.name+' (בטלפון עדיף לבחור מהגלריה, לא מקובץ HEIC)';}
  }
  drawPicked();
});
function drawPicked(){
  $('prev').innerHTML='';
  picked.forEach(p=>{const fg=document.createElement('figure');const im=document.createElement('img');im.src=p.img.src;fg.append(im);
    if(p.state){const s=document.createElement('span');s.className='st';s.textContent=p.state;fg.append(s);}
    $('prev').append(fg);});
  $('go').hidden=!picked.some(p=>p.state!=='✓');
  $('go').textContent=`⬆️ העלאה לאתר (${picked.filter(p=>p.state!=='✓').length})`;
}
$('go').addEventListener('click',async()=>{
  const todo=picked.filter(p=>p.state!=='✓');if(!todo.length)return;
  const cat=$('cat').value,alt=$('alt').value.trim()||CAT_HE[cat],m=$('up-msg');
  $('go').disabled=true;$('pick').disabled=true;$('bar').hidden=false;m.style.color='var(--muted)';m.textContent='מעלה…';
  let done=0,fail=0;const rows=[];
  try{
    for(let i=0;i<todo.length;i+=10){
      const chunk=todo.slice(i,i+10);
      const {uploads}=await api({action:'sign',n:chunk.length});
      for(let k=0;k<chunk.length;k++){
        const p=chunk[k],u=uploads[k];
        try{
          for(const w of [600,1600]){
            const blob=await resized(p.img,w);
            const fd=new FormData();fd.append('cacheControl','31536000');fd.append('',blob,'img.webp');   // כמו studio-order (uploadToSignedUrl)
            const r=await fetch(u['url'+w],{method:'PUT',headers:{'x-upsert':'false',apikey:window.SUPABASE_CONFIG.anonKey},body:fd});
            if(!r.ok)throw new Error('upload '+r.status);
          }
          rows.push({cat,alt,thumb_path:u.path600,full_path:u.path1600,top:true});p.state='✓';done++;
        }catch(err){p.state='✗';fail++;}
        $('bar').firstElementChild.style.width=Math.round((done+fail)/todo.length*100)+'%';drawPicked();
      }
    }
    if(rows.length)await api({action:'add',rows});
    m.style.color=fail?'var(--err)':'var(--ok)';
    m.textContent=fail?`עלו ${done}, נכשלו ${fail} — לחץ שוב על העלאה כדי לנסות את מה שנכשל`:`✓ ${done} תמונות עלו לאתר, בקטגוריה "${CAT_HE[cat]}"`;
    if(!fail){picked=[];setTimeout(()=>{drawPicked();$('bar').hidden=true;},1200);}
    loadList();
  }catch(err){m.style.color='var(--err)';m.textContent='ההעלאה נעצרה: '+err.message+' — נסה שוב';}
  $('go').disabled=false;$('pick').disabled=false;
});

async function loadList(){
  try{
    const {rows}=await api({action:'list'});
    const mine=rows.filter(r=>String(r.thumb_path).startsWith('up/')).sort((a,b)=>a.sort-b.sort);
    $('list').innerHTML=mine.length?'':'<p class="hint">עוד לא העלית תמונות מכאן.</p>';
    mine.forEach(r=>{
      const fg=document.createElement('figure');if(r.hidden)fg.className='hid';
      fg.innerHTML=`<img src="${PUB+r.thumb_path}" alt="" loading="lazy"><figcaption>${CAT_HE[r.cat]||r.cat}${r.hidden?' · מוסתרת':''}</figcaption><div class="acts"><button data-a="hide">${r.hidden?'הצג':'הסתר'}</button><button data-a="del">מחק</button></div>`;
      fg.querySelector('[data-a=hide]').onclick=async()=>{await api({action:'update',id:r.id,hidden:!r.hidden});loadList();};
      fg.querySelector('[data-a=del]').onclick=async()=>{if(!confirm('למחוק את התמונה מהאתר לגמרי?'))return;await api({action:'delete',id:r.id});loadList();};
      $('list').append(fg);
    });
  }catch(err){$('list').innerHTML='<p class="msg" style="color:var(--err)">אין הרשאה או שאין חיבור: '+err.message+'</p>';}
}
</script>
</body>
</html>
