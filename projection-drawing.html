<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ציור באוויר - הקרנה</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #1a1a2e;
    color: #eee;
    font-family: 'Segoe UI', Arial, sans-serif;
    min-height: 100vh;
    overflow: hidden;
    touch-action: none;
  }

  /* ── SCREENS ── */
  .screen { display: none; width: 100vw; height: 100vh; }
  .screen.active { display: flex; flex-direction: column; }

  /* ── SCREEN 0: MODE SELECTION ── */
  #screenMode {
    align-items: center;
    justify-content: center;
    gap: 30px;
    background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
  }
  #screenMode h1 { font-size: 2em; text-align: center; color: #e94560; text-shadow: 0 0 20px #e9456088; }
  #screenMode p { text-align: center; color: #aaa; font-size: 1.1em; }
  .mode-cards { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
  .mode-card {
    background: #16213e;
    border: 2px solid #0f3460;
    border-radius: 20px;
    padding: 30px 24px;
    width: 200px;
    text-align: center;
    cursor: pointer;
    transition: all .3s;
  }
  .mode-card:hover, .mode-card:active { border-color: #e94560; transform: scale(1.04); background: #1a2a4e; }
  .mode-card .icon { font-size: 3em; margin-bottom: 12px; }
  .mode-card h2 { font-size: 1.1em; margin-bottom: 8px; color: #e94560; }
  .mode-card p { font-size: .85em; color: #aaa; line-height: 1.4; }

  /* ── SCREEN 1: CALIBRATION ── */
  #screenCalib {
    background: #000;
    position: relative;
  }
  #calibVideo {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    opacity: .5;
    transform: scaleX(-1);
  }
  #calibOverlay {
    position: absolute; inset: 0;
    pointer-events: none;
  }
  #calibInstructions {
    position: absolute;
    top: 16px; left: 50%; transform: translateX(-50%);
    background: #000c;
    color: #fff;
    padding: 12px 20px;
    border-radius: 12px;
    font-size: 1em;
    text-align: center;
    z-index: 10;
    max-width: 90vw;
  }
  #calibPoints {
    position: absolute; inset: 0;
    z-index: 8;
    pointer-events: none;
  }
  .calib-dot {
    position: absolute;
    width: 40px; height: 40px;
    border-radius: 50%;
    border: 3px solid #fff;
    transform: translate(-50%, -50%);
    display: flex; align-items: center; justify-content: center;
    font-weight: bold; font-size: 14px; color: #fff;
  }
  .calib-dot.done { background: #00ff88cc; border-color: #00ff88; }
  .calib-dot.active { background: #e94560cc; border-color: #e94560; animation: pulse 1s infinite; }
  .calib-dot.pending { background: #ffffff22; }
  @keyframes pulse { 0%,100%{transform:translate(-50%,-50%) scale(1)} 50%{transform:translate(-50%,-50%) scale(1.25)} }
  #calibTapZone {
    position: absolute; inset: 0; z-index: 9;
    cursor: crosshair;
  }
  #calibBtn {
    position: absolute;
    bottom: 30px; left: 50%; transform: translateX(-50%);
    z-index: 10;
    padding: 14px 36px;
    background: #e94560;
    color: #fff;
    border: none;
    border-radius: 50px;
    font-size: 1.1em;
    cursor: pointer;
    display: none;
  }

  /* ── SCREEN 2: DRAWING ── */
  #screenDraw { background: #000; position: relative; }
  #camVideo {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    transform: scaleX(-1);
    opacity: .15;
    pointer-events: none;
  }
  #drawCanvas {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 2;
  }
  #debugCanvas {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 3;
    opacity: .6;
  }

  /* ── TOOLBAR ── */
  #toolbar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    z-index: 20;
    background: #000a;
    backdrop-filter: blur(10px);
    padding: 10px 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .tb-row { display: flex; align-items: center; gap: 10px; flex-wrap: nowrap; overflow-x: auto; }
  .tb-row::-webkit-scrollbar { display: none; }

  /* Color swatches */
  .color-swatch {
    width: 36px; height: 36px;
    border-radius: 50%;
    border: 3px solid transparent;
    cursor: pointer;
    flex-shrink: 0;
    transition: transform .2s;
  }
  .color-swatch.selected { border-color: #fff; transform: scale(1.2); }

  /* Sliders row */
  .tb-label { font-size: .75em; color: #aaa; white-space: nowrap; flex-shrink: 0; }
  input[type=range] {
    -webkit-appearance: none;
    height: 6px;
    border-radius: 3px;
    background: #444;
    flex: 1;
    min-width: 60px;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 20px; height: 20px;
    border-radius: 50%;
    background: #e94560;
    cursor: pointer;
  }

  /* Buttons */
  .tb-btn {
    padding: 8px 14px;
    border: none;
    border-radius: 20px;
    font-size: .85em;
    cursor: pointer;
    flex-shrink: 0;
    font-weight: bold;
  }
  #btnClear { background: #e94560; color: #fff; }
  #btnSave { background: #00c896; color: #fff; }
  #btnMode { background: #333; color: #aaa; }
  #btnDynamic { background: #0f3460; color: #7bb; font-size: .75em; }

  /* Status badge */
  #statusBadge {
    position: fixed;
    top: 12px; left: 50%; transform: translateX(-50%);
    z-index: 30;
    background: #000b;
    padding: 6px 16px;
    border-radius: 20px;
    font-size: .8em;
    color: #aaa;
    pointer-events: none;
  }
  #statusBadge span { color: #00ff88; font-weight: bold; }

  /* Finger dot cursor */
  #fingerDot {
    position: fixed;
    width: 22px; height: 22px;
    border-radius: 50%;
    border: 3px solid #fff;
    background: transparent;
    pointer-events: none;
    z-index: 40;
    transform: translate(-50%, -50%);
    transition: background .1s;
    display: none;
  }
  #fingerDot.drawing { background: #fff5; }

  /* Toast */
  #toast {
    position: fixed;
    bottom: 130px; left: 50%; transform: translateX(-50%);
    background: #000c;
    color: #fff;
    padding: 10px 22px;
    border-radius: 24px;
    font-size: .95em;
    z-index: 50;
    opacity: 0;
    transition: opacity .3s;
    pointer-events: none;
    white-space: nowrap;
  }
  #toast.show { opacity: 1; }

  /* Loading overlay */
  #loading {
    position: fixed; inset: 0;
    background: #000d;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 100;
    gap: 16px;
  }
  #loading.hidden { display: none; }
  .spinner {
    width: 48px; height: 48px;
    border: 4px solid #333;
    border-top-color: #e94560;
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<!-- LOADING -->
<div id="loading">
  <div class="spinner"></div>
  <p id="loadingMsg">טוען MediaPipe...</p>
</div>

<!-- SCREEN 0: MODE -->
<div id="screenMode" class="screen active">
  <h1>🎨 ציור באוויר</h1>
  <p>בחר מצב עבודה</p>
  <div class="mode-cards">
    <div class="mode-card" id="btnStatic">
      <div class="icon">📌</div>
      <h2>מצב קבוע</h2>
      <p>המצלמה והמקרן קבועים ולא זזים. כיול חד-פעמי.</p>
    </div>
    <div class="mode-card" id="btnDynamic2">
      <div class="icon">🔄</div>
      <h2>מצב דינמי</h2>
      <p>המצלמה יכולה לזוז. כיול אוטומטי מתמיד.</p>
    </div>
  </div>
</div>

<!-- SCREEN 1: CALIBRATION -->
<div id="screenCalib" class="screen">
  <video id="calibVideo" autoplay playsinline muted></video>
  <canvas id="calibOverlay"></canvas>
  <div id="calibPoints"></div>
  <div id="calibTapZone"></div>
  <div id="calibInstructions">לחץ על <strong>פינה 1 (שמאל-עליון)</strong> של מסגרת ההקרנה</div>
  <button id="calibBtn">✅ אישור כיול – התחל ציור</button>
</div>

<!-- SCREEN 2: DRAW -->
<div id="screenDraw" class="screen">
  <video id="camVideo" autoplay playsinline muted></video>
  <canvas id="drawCanvas"></canvas>
  <canvas id="debugCanvas"></canvas>

  <div id="statusBadge">מצב: <span id="modeLabel">—</span></div>
  <div id="fingerDot"></div>

  <div id="toolbar">
    <!-- Row 1: colors -->
    <div class="tb-row" id="colorRow"></div>
    <!-- Row 2: sliders + actions -->
    <div class="tb-row">
      <span class="tb-label">עובי</span>
      <input type="range" id="brushSize" min="2" max="40" value="8">
      <span class="tb-label">שקיפות</span>
      <input type="range" id="opacity" min="10" max="100" value="90">
      <button class="tb-btn" id="btnClear">🗑 מחק</button>
      <button class="tb-btn" id="btnSave">💾 שמור</button>
      <button class="tb-btn" id="btnMode">⚙ מצב</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// ─────────────────────────────────────────────
// CONFIG
// ─────────────────────────────────────────────
const COLORS = [
  '#ff2d55','#ff9500','#ffcc00','#4cd964',
  '#5ac8fa','#007aff','#af52de','#ffffff',
  '#000000','#8e8e93'
];

const CALIB_LABELS = [
  'שמאל-עליון','ימין-עליון','ימין-תחתון','שמאל-תחתון'
];

// ─────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────
let appMode = 'static'; // 'static' | 'dynamic'
let calibPoints = [];   // [{x,y}] screen coords, up to 4
let H = null;           // 3x3 homography matrix (Float64Array)

let drawing = false;
let lastPt  = null;
let currentColor = COLORS[0];
let brushSize = 8;
let opacity = 0.9;

let videoEl, drawCtx, debugCtx, fingerDot;
let hands = null;
let mpCamera = null;

// ─────────────────────────────────────────────
// UTILS
// ─────────────────────────────────────────────
function show(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); document.getElementById(id).classList.add('active'); }
function toast(msg, ms=2200){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(()=>t.classList.remove('show'), ms);
}

// ─────────────────────────────────────────────
// COLORS UI
// ─────────────────────────────────────────────
const colorRow = document.getElementById('colorRow');
COLORS.forEach(c => {
  const s = document.createElement('div');
  s.className = 'color-swatch' + (c===currentColor?' selected':'');
  s.style.background = c;
  s.addEventListener('click', ()=>{
    currentColor = c;
    colorRow.querySelectorAll('.color-swatch').forEach(el=>el.classList.remove('selected'));
    s.classList.add('selected');
  });
  colorRow.appendChild(s);
});
document.getElementById('brushSize').addEventListener('input', e => brushSize = +e.target.value);
document.getElementById('opacity').addEventListener('input', e => opacity = e.target.value/100);

// ─────────────────────────────────────────────
// SCREEN 0 → MODE SELECTION
// ─────────────────────────────────────────────
document.getElementById('btnStatic').addEventListener('click', ()=>{ appMode='static'; startCalibration(); });
document.getElementById('btnDynamic2').addEventListener('click', ()=>{ appMode='dynamic'; startCalibration(); });
document.getElementById('btnMode').addEventListener('click', ()=>{ stopCamera(); show('screenMode'); });

// ─────────────────────────────────────────────
// CALIBRATION
// ─────────────────────────────────────────────
function startCalibration(){
  show('screenCalib');
  calibPoints = [];
  renderCalibDots();
  updateCalibInstruction();
  document.getElementById('calibBtn').style.display = 'none';

  const vid = document.getElementById('calibVideo');
  navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width:{ideal:1280}, height:{ideal:720} } })
    .then(stream => { vid.srcObject = stream; vid._stream = stream; })
    .catch(()=>toast('לא ניתן לגשת למצלמה'));

  document.getElementById('calibTapZone').addEventListener('click', onCalibTap, { once: false });
}

function onCalibTap(e){
  if(calibPoints.length >= 4) return;
  const rect = e.currentTarget.getBoundingClientRect();
  const x = (e.clientX - rect.left) / rect.width;
  const y = (e.clientY - rect.top)  / rect.height;
  calibPoints.push({x, y});
  renderCalibDots();
  updateCalibInstruction();
  if(calibPoints.length === 4){
    document.getElementById('calibTapZone').removeEventListener('click', onCalibTap);
    document.getElementById('calibBtn').style.display = 'block';
    if(appMode==='static') computeHomography();
  }
}

function renderCalibDots(){
  const container = document.getElementById('calibPoints');
  container.innerHTML = '';
  const positions = [
    {tx:'10%',ty:'10%'}, {tx:'90%',ty:'10%'},
    {tx:'90%',ty:'90%'}, {tx:'10%',ty:'90%'}
  ];
  positions.forEach((pos, i)=>{
    const d = document.createElement('div');
    d.className = 'calib-dot ' + (i<calibPoints.length?'done': i===calibPoints.length?'active':'pending');
    d.style.left = pos.tx; d.style.top = pos.ty;
    d.textContent = i+1;
    if(i < calibPoints.length){
      d.style.left = (calibPoints[i].x*100)+'%';
      d.style.top  = (calibPoints[i].y*100)+'%';
    }
    container.appendChild(d);
  });
}

function updateCalibInstruction(){
  const el = document.getElementById('calibInstructions');
  if(calibPoints.length < 4){
    el.innerHTML = `לחץ על <strong>פינה ${calibPoints.length+1} (${CALIB_LABELS[calibPoints.length]})</strong> של מסגרת ההקרנה`;
  } else {
    el.textContent = '✅ כל 4 הפינות סומנו! לחץ אישור להתחיל ציור.';
  }
}

document.getElementById('calibBtn').addEventListener('click', ()=>{
  // Stop calib video
  const vid = document.getElementById('calibVideo');
  if(vid._stream) vid._stream.getTracks().forEach(t=>t.stop());
  startDrawingScreen();
});

// ─────────────────────────────────────────────
// HOMOGRAPHY (simple perspective transform)
// Solve H such that H * srcPt ≈ dstPt
// src = unit square corners, dst = calibPoints
// ─────────────────────────────────────────────
function computeHomography(){
  // Source = normalised canvas corners
  const src = [{x:0,y:0},{x:1,y:0},{x:1,y:1},{x:0,y:1}];
  const dst = calibPoints; // already normalised (0-1)
  H = getDLTHomography(src, dst);
}

function getDLTHomography(src, dst){
  // Build 8x9 matrix A for Ah=0 (direct linear transform)
  const A = [];
  for(let i=0;i<4;i++){
    const sx=src[i].x, sy=src[i].y;
    const dx=dst[i].x, dy=dst[i].y;
    A.push([-sx,-sy,-1, 0,0,0, dx*sx, dx*sy, dx]);
    A.push([ 0,0,0,-sx,-sy,-1, dy*sx, dy*sy, dy]);
  }
  // Solve via SVD-like: use simple pseudo-inverse (Gaussian elimination)
  const h = solveDLT(A);
  return h; // 9-element array → 3x3
}

function solveDLT(A){
  // Reduced SVD via power iteration is heavy; use a simpler closed-form
  // for 4-point homography (DLT with 8 equations, 8 DOF)
  // We fix h[8]=1 and solve 8x8 system
  const n = 8;
  const M = A.map(row => row.slice(0,n));
  const b = A.map(row => -row[n]);
  // Gaussian elimination
  for(let col=0;col<n;col++){
    // pivot
    let maxR=col, maxV=Math.abs(M[col][col]);
    for(let r=col+1;r<2*n;r++){
      if(Math.abs(M[r][col])>maxV){ maxV=Math.abs(M[r][col]); maxR=r; }
    }
    [M[col],M[maxR]]=[M[maxR],M[col]];
    [b[col],b[maxR]]=[b[maxR],b[col]];
    const piv=M[col][col];
    if(Math.abs(piv)<1e-10) continue;
    for(let r=0;r<2*n;r++){
      if(r===col) continue;
      const f=M[r][col]/piv;
      for(let c=0;c<n;c++) M[r][c]-=f*M[col][c];
      b[r]-=f*b[col];
    }
  }
  const h = M.map((row,i)=>b[i]/row[i]);
  h.push(1);
  return h;
}

// Apply 3x3 homography to point (normalised 0-1)
function applyH(h, px, py){
  const w = h[6]*px + h[7]*py + h[8];
  const x = (h[0]*px + h[1]*py + h[2]) / w;
  const y = (h[3]*px + h[4]*py + h[5]) / w;
  return {x, y};
}

// ─────────────────────────────────────────────
// DRAWING SCREEN
// ─────────────────────────────────────────────
function startDrawingScreen(){
  show('screenDraw');
  document.getElementById('modeLabel').textContent = appMode==='static'?'קבוע 📌':'דינמי 🔄';

  const drawCanvas = document.getElementById('drawCanvas');
  const debugCanvas= document.getElementById('debugCanvas');
  fingerDot = document.getElementById('fingerDot');

  function resize(){
    drawCanvas.width  = window.innerWidth;
    drawCanvas.height = window.innerHeight;
    debugCanvas.width = window.innerWidth;
    debugCanvas.height= window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  drawCtx  = drawCanvas.getContext('2d');
  debugCtx = debugCanvas.getContext('2d');

  videoEl = document.getElementById('camVideo');

  loadMediaPipe();
}

// ─────────────────────────────────────────────
// MEDIAPIPE LOAD
// ─────────────────────────────────────────────
function loadMediaPipe(){
  const loading = document.getElementById('loading');
  const msg = document.getElementById('loadingMsg');
  loading.classList.remove('hidden');
  msg.textContent = 'טוען MediaPipe Hands...';

  // Load scripts dynamically
  function loadScript(src){
    return new Promise((res,rej)=>{
      const s=document.createElement('script'); s.src=src;
      s.onload=res; s.onerror=rej;
      document.head.appendChild(s);
    });
  }

  const CDN = 'https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/';
  const CAM  = 'https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1640029074/camera_utils.js';

  loadScript(CDN+'hands.js')
    .then(()=>loadScript(CAM))
    .then(()=>{
      msg.textContent = 'מאתחל זיהוי יד...';
      initHands();
    })
    .catch(()=>{
      msg.textContent = '⚠️ MediaPipe לא נטען. בדוק חיבור אינטרנט.';
    });
}

function initHands(){
  hands = new Hands({
    locateFile: file =>
      `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/${file}`
  });
  hands.setOptions({
    maxNumHands: 1,
    modelComplexity: 1,
    minDetectionConfidence: 0.7,
    minTrackingConfidence: 0.5
  });
  hands.onResults(onHandResults);

  navigator.mediaDevices.getUserMedia({
    video: { facingMode: 'environment', width:{ideal:640}, height:{ideal:480} }
  }).then(stream=>{
    videoEl.srcObject = stream;
    videoEl._stream = stream;
    videoEl.onloadedmetadata = ()=>{
      const camera = new Camera(videoEl,{
        onFrame: async ()=>{ await hands.send({image: videoEl}); },
        width:640, height:480
      });
      camera.start();
      document.getElementById('loading').classList.add('hidden');
    };
  }).catch(()=>{
    document.getElementById('loadingMsg').textContent = '⚠️ לא ניתן לגשת למצלמה';
  });
}

// ─────────────────────────────────────────────
// HAND RESULTS
// ─────────────────────────────────────────────
function onHandResults(results){
  const W = window.innerWidth, H_px = window.innerHeight;
  debugCtx.clearRect(0,0,W,H_px);

  if(!results.multiHandLandmarks || results.multiHandLandmarks.length===0){
    drawing = false;
    lastPt = null;
    fingerDot.style.display='none';
    return;
  }

  const lm = results.multiHandLandmarks[0];

  // Index fingertip = landmark 8
  // Thumb tip = landmark 4
  const tip  = lm[8];  // {x,y,z} normalised, mirrored
  const thumb= lm[4];

  // Mirror X (video is mirrored)
  const fx = 1 - tip.x;
  const fy = tip.y;

  // Check pinch (thumb–index distance) → controls drawing
  const pinchDist = Math.hypot(thumb.x - tip.x, thumb.y - tip.y);
  const isPinching = pinchDist < 0.07;

  // In dynamic mode: try to re-detect frame corners from brightness/contrast
  // For simplicity in web version: rely on existing calibration but mark as dynamic
  // (full ArUco detection requires WASM; here we use the calibrated H but label it dynamic)

  // Map finger to canvas coords via homography (if calibrated)
  let cx = fx * W;
  let cy = fy * H_px;
  
  if(H){
    // Apply inverse homography: canvas coord → screen coord
    // H maps [0,1] canvas → [0,1] calib screen
    // We need: finger at (fx,fy) → drawing canvas (cx,cy)
    // Use H to warp into the projection frame
    const mapped = applyH(H, fx, fy);
    cx = mapped.x * W;
    cy = mapped.y * H_px;
  }

  // Show finger dot
  fingerDot.style.display = 'block';
  fingerDot.style.left = cx+'px';
  fingerDot.style.top  = cy+'px';
  fingerDot.className = 'fingerDot' + (isPinching ? ' drawing' : '');

  // Draw skeleton (debug)
  drawSkeleton(lm, W, H_px);

  // Draw stroke
  if(isPinching){
    if(!drawing){ drawing=true; lastPt={x:cx,y:cy}; }
    const hex = currentColor;
    const alpha = opacity;
    drawCtx.strokeStyle = hexToRgba(hex, alpha);
    drawCtx.lineWidth = brushSize;
    drawCtx.lineCap = 'round';
    drawCtx.lineJoin = 'round';
    drawCtx.beginPath();
    drawCtx.moveTo(lastPt.x, lastPt.y);
    drawCtx.lineTo(cx, cy);
    drawCtx.stroke();
    lastPt = {x:cx, y:cy};
  } else {
    drawing = false;
    lastPt = null;
  }
}

function drawSkeleton(lm, W, H){
  const CONNECTIONS = [
    [0,1],[1,2],[2,3],[3,4],
    [0,5],[5,6],[6,7],[7,8],
    [5,9],[9,10],[10,11],[11,12],
    [9,13],[13,14],[14,15],[15,16],
    [13,17],[17,18],[18,19],[19,20],[0,17]
  ];
  debugCtx.strokeStyle='rgba(0,255,136,0.5)';
  debugCtx.lineWidth=1.5;
  CONNECTIONS.forEach(([a,b])=>{
    debugCtx.beginPath();
    debugCtx.moveTo((1-lm[a].x)*W, lm[a].y*H);
    debugCtx.lineTo((1-lm[b].x)*W, lm[b].y*H);
    debugCtx.stroke();
  });
  // fingertip dot
  debugCtx.fillStyle='#ff2d55';
  debugCtx.beginPath();
  debugCtx.arc((1-lm[8].x)*W, lm[8].y*H, 6, 0, Math.PI*2);
  debugCtx.fill();
}

function hexToRgba(hex, a){
  const r=parseInt(hex.slice(1,3),16);
  const g=parseInt(hex.slice(3,5),16);
  const b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

// ─────────────────────────────────────────────
// CLEAR & SAVE
// ─────────────────────────────────────────────
document.getElementById('btnClear').addEventListener('click', ()=>{
  const c = document.getElementById('drawCanvas');
  drawCtx.clearRect(0,0,c.width,c.height);
  toast('הקנבס נוקה!');
});

document.getElementById('btnSave').addEventListener('click', ()=>{
  const c = document.getElementById('drawCanvas');
  // Composite: black bg + drawing
  const tmp = document.createElement('canvas');
  tmp.width = c.width; tmp.height = c.height;
  const tCtx = tmp.getContext('2d');
  tCtx.fillStyle='#000';
  tCtx.fillRect(0,0,tmp.width,tmp.height);
  tCtx.drawImage(c,0,0);
  tmp.toBlob(blob=>{
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'drawing-' + Date.now() + '.png';
    a.click();
    setTimeout(()=>URL.revokeObjectURL(url), 5000);
    toast('התמונה נשמרה! 🎉');
  },'image/png');
});

// ─────────────────────────────────────────────
// STOP CAMERA
// ─────────────────────────────────────────────
function stopCamera(){
  if(videoEl && videoEl._stream)
    videoEl._stream.getTracks().forEach(t=>t.stop());
  if(hands){ hands.close(); hands=null; }
}
