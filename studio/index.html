<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>סטודיו הדפסה וחיתוך — הושעיה</title>
<!-- גרסה: ראו VERSION בסקריפט ו-CHANGELOG-studio.md -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#14294D">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="סטודיו">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&family=Secular+One&family=Heebo:wght@400;800&family=Varela+Round&family=Frank+Ruhl+Libre:wght@500;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  --navy:#14294D; --navy-2:#1F3A68; --gold:#C6A135; --gold-soft:#F3E8C4;
  --mat:#D5E3E8; --mat-line:#BACFD7; --mat-fine:#C9DBE2;
  --ink:#16202E; --muted:#5B6878; --paper:#FFFFFF; --cut:#E23B2E; --line:#D9E1E7;
  --panel:#F7F9FA;
  --ui:'Rubik',system-ui,sans-serif; --display:'Secular One','Rubik',sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
:root{padding-top:env(safe-area-inset-top,0px)}
body{font-family:var(--ui);color:var(--ink);background:var(--panel);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
header.top{background:var(--navy);color:#fff;padding:10px 14px 0;position:relative}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{font-family:var(--display);font-weight:400;font-size:1.35rem;margin:0;letter-spacing:.2px}
.brand h1 b{color:var(--gold);font-weight:400}
.brand .ver{font-size:.75rem;color:#AFC0DA}
nav.tabs{display:flex;gap:4px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:0 0 auto;border:0;background:transparent;color:#C9D5E8;padding:10px 14px 11px;border-radius:10px 10px 0 0;cursor:pointer;font-weight:500;font-size:.95rem}
nav.tabs button[aria-selected="true"]{background:var(--panel);color:var(--navy);font-weight:700}
nav.tabs button:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
main{display:grid;grid-template-columns:minmax(0,1fr);min-height:0}
main>*{min-width:0}
body{overflow-x:hidden}
.preview{position:sticky;top:0;z-index:5;height:46vh;display:flex;flex-direction:column;border-bottom:1px solid var(--mat-line);
  background-color:var(--mat);
  background-image:linear-gradient(var(--mat-line) 1px,transparent 1px),linear-gradient(90deg,var(--mat-line) 1px,transparent 1px),linear-gradient(var(--mat-fine) 1px,transparent 1px),linear-gradient(90deg,var(--mat-fine) 1px,transparent 1px);
  background-size:48px 48px,48px 48px,12px 12px,12px 12px}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:10px}
.stage canvas{height:100%;max-width:100%;aspect-ratio:210/297;background:#fff;box-shadow:0 1px 0 #9fb3bd,0 8px 24px rgba(20,41,77,.18);border-radius:2px}
.pagebar{display:flex;gap:6px;align-items:center;padding:0 10px 8px;overflow-x:auto;min-height:38px}
.pagebar .chip{flex:0 0 auto;border:1px solid var(--mat-line);background:rgba(255,255,255,.75);border-radius:999px;padding:5px 11px;font-size:.8rem;cursor:pointer}
.pagebar .chip[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.pagebar .sum{margin-inline-start:auto;font-size:.8rem;color:var(--navy);white-space:nowrap;padding-inline-start:8px;font-weight:500}
.controls{padding:12px 12px 110px;max-width:640px;width:100%;margin:0 auto}
.intro{font-size:.9rem;color:var(--muted);margin:2px 2px 12px;line-height:1.5}
details.sec{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:10px}
details.sec>summary{list-style:none;cursor:pointer;padding:12px 14px;font-weight:700;color:var(--navy);display:flex;align-items:center;gap:8px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::after{content:"";margin-inline-start:auto;width:8px;height:8px;border-inline-start:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s}
details.sec[open]>summary::after{transform:rotate(135deg)}
.sec .body{padding:0 14px 14px;display:grid;gap:10px}
.row{display:grid;grid-template-columns:118px 1fr;align-items:center;gap:10px}
.row>label{font-size:.88rem;color:var(--muted)}
.row input[type=number],.row input[type=text],.row select,textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;min-height:40px}
textarea{resize:vertical;line-height:1.5}
.row input[type=color]{width:52px;height:36px;border:1px solid var(--line);border-radius:8px;padding:2px;background:#fff}
.row input[type=range]{width:100%;accent-color:var(--navy)}
.inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rules{background:#F6F3EA;border:1px solid #E7DFC6;border-radius:10px;padding:8px 10px;margin:8px 0;font-size:.85rem;line-height:1.5}
.rules p{margin:4px 0}
.hint{font-size:.8rem;color:var(--muted);line-height:1.45}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;cursor:pointer;font-size:.88rem}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.shapes{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.shapes button{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:6px 4px 4px;cursor:pointer;font-size:.75rem;color:var(--muted)}
.shapes button canvas{display:block;width:100%;height:44px}
.shapes button[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-soft);color:var(--navy);font-weight:700}
.files{display:flex;flex-wrap:wrap;gap:6px}
.wstyles{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:6px}
.wstyles button{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:6px 4px;cursor:pointer;font-size:.78rem;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px}
.wstyles button[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-soft);color:var(--navy)}
.wstyles canvas{width:52px;height:auto}
.figsets{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.figsets button{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:6px 4px;cursor:pointer;font-size:.75rem;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px}
.figsets button[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-soft);color:var(--navy)}
.figsets img{height:56px;width:auto;border-radius:3px}
.figsets .fnone{height:56px;display:flex;align-items:center;font:800 1.6rem Rubik,sans-serif;color:var(--navy)}
.wprev{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.wprev canvas,.wthumb{width:54px;height:auto;border-radius:4px}
details.face{border:1px solid var(--line);border-radius:10px;background:#fff}
details.face>summary{padding:10px 12px;cursor:pointer;font-weight:700;list-style:none}
details.face>.body{padding:0 12px 12px;display:grid;gap:8px}
.secv{width:100%;display:block;touch-action:none;border-radius:10px;background:repeating-linear-gradient(0deg,transparent 0 11px,var(--mat-fine) 11px 12px),repeating-linear-gradient(90deg,transparent 0 11px,var(--mat-fine) 11px 12px),var(--mat);cursor:grab}
.addrow{display:flex;flex-wrap:wrap;gap:6px}
.addrow .btn{padding:8px 12px}
.egrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:6px}
.egrid button{font-size:1.6rem;height:52px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer}
.lpanel{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:10px;margin-top:4px}
.kids{display:grid;gap:8px}
.kid{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:10px;background:#fff}
.kid.on{border-color:var(--gold);background:#FFFBEB}
.kid b{min-width:64px}
.kid select{max-width:150px;min-height:40px;border:1px solid var(--line);border-radius:8px}
.kid .btn{padding:6px 12px;min-height:40px}
.files .th{width:52px;height:52px;border-radius:8px;border:1px solid var(--line);display:block}
.chk{background:repeating-conic-gradient(#E5E7EB 0 25%,#fff 0 50%) 0 0/10px 10px}
.files .tb{position:relative}
.files .tb .open{border:0;padding:0;background:none;cursor:pointer;border-radius:8px}
.files .tb .open:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.files .tb .x,.cth .x,.cth .cut{position:absolute;width:28px;height:28px;border-radius:50%;border:2px solid #fff;color:#fff;cursor:pointer;font-size:.95rem;line-height:1;display:flex;align-items:center;justify-content:center;padding:0}
.files .tb .x{top:-10px;inset-inline-end:-10px;background:#B91C1C}
.cstrip{display:flex;flex-wrap:wrap;gap:14px;min-height:72px;align-items:center;padding:8px 4px}
.cth{position:relative}
.cth canvas{width:68px;height:68px;border-radius:10px;border:2px solid var(--line);display:block}
.cth.sel canvas{border-color:var(--gold)}
.cth .x{top:-10px;inset-inline-end:-10px;background:#B91C1C}
.cth .cut{bottom:-10px;inset-inline-end:-10px;background:var(--navy)}
.cth .cut.on{background:#16A34A}
.fe{display:grid;gap:6px}.fewrap{display:flex;justify-content:center}.fecv{touch-action:none;border-radius:8px;box-shadow:0 1px 6px rgba(20,41,77,.18);cursor:pointer}.fei{text-align:center;min-height:1.4em}
.labar{height:8px;border-radius:4px;background:#E5E7EB;overflow:hidden;margin:8px 0}.lafill{height:100%;width:0;background:var(--gold,#C6A135);transition:width .2s}.labar.busy .lafill{width:40%!important;animation:labusy 1.2s ease-in-out infinite}@keyframes labusy{0%{margin-inline-start:-40%}100%{margin-inline-start:100%}}
.lawait{display:grid;gap:6px;padding:8px 0}.lares{display:grid;gap:10px}.lares[hidden],.lawait[hidden]{display:none}.lawrap{display:flex;justify-content:center}.lacv{max-width:100%;border-radius:6px;box-shadow:0 1px 6px rgba(20,41,77,.18);background:#fff}
.phgal{display:flex;flex-wrap:wrap;gap:8px}.phth{position:relative}.phth>button:first-child{border:2px solid transparent;border-radius:8px;padding:0;background:none;cursor:pointer}.phth.sel>button:first-child{border-color:var(--gold,#C6A135)}
.phth .x{position:absolute;top:-8px;inset-inline-end:-8px;width:26px;height:26px;border-radius:50%;border:2px solid #fff;background:#E23B2E;color:#fff;cursor:pointer;line-height:1}
.phfl{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}.phfl button{display:flex;flex-direction:column;align-items:center;gap:2px;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:4px 2px;cursor:pointer;font-size:.7rem;color:var(--muted)}.phfl button[aria-pressed=true]{border-color:var(--gold,#C6A135);color:var(--navy)}
.adminonly{background:#FEF3C7;border-radius:8px;padding:6px 8px;color:#7C2D12}
.icon4w{display:grid;gap:4px}.icon4e{padding:4px 6px;font-size:.72rem}
.icons4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.icon4{display:flex;flex-direction:column;align-items:center;gap:2px;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:6px 2px;cursor:pointer;font-size:.75rem;color:var(--muted)}
.shaperow{display:flex;align-items:center;gap:8px;flex:1;min-width:160px;max-width:320px}.shaperow input{flex:1}.shaperow span{font-size:.8rem;color:var(--muted);white-space:nowrap}
.edwrap{display:flex;justify-content:center;touch-action:none}
.edwrap canvas{max-width:100%;touch-action:none;border-radius:6px;cursor:crosshair}
.busy{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.6);font-weight:700;color:var(--navy)}
.busy[hidden],.row[hidden]{display:none}
.btn{border:0;border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:700}
.btn.gold{background:var(--gold);color:var(--navy)}
.btn.navy{background:var(--navy);color:#fff}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--navy)}
.btn[hidden]{display:none}
.btn:focus-visible,.seg button:focus-visible,.shapes button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.actions{position:fixed;bottom:0;inset-inline:0;z-index:20;background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;justify-content:center}
.actions .btn{flex:1;max-width:260px}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.links{display:grid;gap:8px}
.links a{display:block;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--navy);text-decoration:none;font-weight:600}
.links a span{display:block;font-weight:400;font-size:.8rem;color:var(--muted);margin-top:2px}
.status{font-size:.85rem;display:grid;gap:4px}
.ok{color:#15803D}.bad{color:#B91C1C}

.fontbtn{width:100%;display:flex;flex-direction:column;align-items:stretch;gap:2px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:6px 10px;cursor:pointer;text-align:start}
.fontbtn .fsample{font-size:1.35rem;line-height:1.3;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fontbtn .fname{font-size:.75rem;color:var(--muted)}
.fmodal{position:fixed;inset:0;z-index:50;background:rgba(20,41,77,.45);display:flex;align-items:flex-end;justify-content:center}
.fmodal[hidden]{display:none}
.fsheet{background:#fff;width:100%;max-width:680px;max-height:88vh;border-radius:16px 16px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.fhead{display:flex;gap:8px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.fhead h2{font-family:var(--display);font-weight:400;font-size:1.1rem;margin:0;color:var(--navy);white-space:nowrap}
.fhead input{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.fhead button{border:0;background:var(--panel);border-radius:8px;width:40px;height:40px;cursor:pointer;font-size:1.1rem}
#fontList{overflow-y:auto;padding:4px 14px 18px}
.fcat{font-size:.85rem;color:var(--muted);margin:14px 0 6px;font-weight:500}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ftile{border:1.5px solid var(--line);border-radius:10px;background:#fff;padding:10px 8px 6px;cursor:pointer;display:flex;flex-direction:column;gap:4px;opacity:.45;text-align:center}
.ftile.ready{opacity:1}
.ftile .fsample{font-size:1.6rem;line-height:1.25;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ftile .fname{font-family:var(--ui);font-size:.72rem;color:var(--muted)}
.ftile.sel{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-soft)}
.glist{display:grid;gap:8px}
.gitem{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px;background:#fff}
.gitem.on{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-soft)}
.gitem canvas{width:64px;height:40px}
.gitem .gt{font-weight:600;color:var(--navy);font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gitem .gq{display:flex;gap:6px;align-items:center;font-size:.8rem;color:var(--muted)}
.gitem .gq input{width:64px;border:1px solid var(--line);border-radius:6px;padding:4px 6px}
.gitem .gb{display:flex;gap:4px}
.gitem .gb button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 8px;cursor:pointer;font-size:.8rem}
.obody{padding:14px;display:grid;gap:10px;overflow-y:auto;grid-auto-rows:max-content} /* max-content: בלי זה שורה עם flex-wrap (רצועת החיתוכים) נמעכת ל-min-height והתוכן עולה על מה שמתחתיה */
.obody input,.obody textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;min-height:44px}
.obody input[type=checkbox]{width:20px;height:20px;min-height:0;padding:0;accent-color:var(--navy)}
.obody input[type=range]{min-height:0;padding:0;border:0;accent-color:var(--navy)}
.obody .price{font-family:var(--display);font-size:1.6rem;color:var(--navy)}
.obody .big{font-family:var(--display);font-size:2rem;color:var(--navy);letter-spacing:1px}
.obody .err{color:#B91C1C;font-size:.9rem}
.obody img.prev{max-width:100%;max-height:34vh;margin:0 auto;border:1px solid var(--line);border-radius:6px;display:block}
body:not(.admin) .adm{display:none!important}
body.admin .cust{display:none!important}
.adminbadge{font-size:.72rem;background:var(--gold);color:var(--navy);border-radius:999px;padding:2px 8px;font-weight:700}
.olist{display:grid;gap:8px}
.oitem{border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff;display:grid;gap:6px;font-size:.88rem}
.oitem .top{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.oitem .top b{font-family:var(--display);font-weight:400;color:var(--navy);font-size:1.05rem}
.oitem .st{font-size:.75rem;border-radius:999px;padding:2px 8px;background:var(--panel)}
.oitem .st.new{background:#FEF3C7}.oitem .st.uploading{background:#FEE2E2}.oitem .st.done{background:#DCFCE7}
.oitem .acts{display:flex;gap:6px;flex-wrap:wrap}
.oitem .acts button,.oitem .acts a{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:.8rem;color:var(--navy);text-decoration:none}
.oitem .acts button.open{background:var(--gold,#C6A135);color:#fff;border-color:transparent;font-weight:700}
.foot{text-align:center;padding:8px 0 4px;font-size:.75rem}
.foot button{border:0;background:none;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:.75rem}
.foot .install{display:block;margin:0 auto 10px;background:var(--navy);color:#fff;text-decoration:none;border-radius:10px;padding:10px 16px;font-size:.9rem;font-weight:700}
@media(min-width:900px){
  main{grid-template-columns:minmax(360px,440px) minmax(0,1fr);height:calc(100vh - 92px)}
  .controls{grid-column:1;grid-row:1;overflow-y:auto;height:100%;padding-bottom:30px;max-width:none}
  .preview{grid-column:2;grid-row:1;height:100%;border-bottom:0;border-inline-start:1px solid var(--mat-line)}
  .actions{position:static;border-top:0;background:transparent;padding:0 10px 10px;justify-content:flex-start}
  .preview .actions{display:flex}
  body>.actions{display:none}
}
@media(max-width:899px){.preview .actions{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><h1>סטודיו <b>הדפסה וחיתוך</b></h1><span class="ver" id="ver"></span></div>
  <nav class="tabs" role="tablist" id="tabs"></nav>
</header>
<main>
  <section class="preview" aria-label="תצוגת הדף">
    <div class="stage"><canvas id="cv" width="420" height="594" aria-label="תצוגה מקדימה של דף A4"></canvas></div>
    <div class="pagebar" id="pagebar"></div>
    <div class="actions">
      <button class="btn gold cust" data-act="order">שלח הזמנה</button>
      <button class="btn gold" data-act="phdl" hidden>⬇️ הורדת התמונה</button>
      <button class="btn gold adm" data-act="pdf">הורד PDF להדפסה</button>
      <button class="btn ghost adm" data-act="pdfa4" hidden>PDF דפי A4</button>
      <button class="btn navy adm" data-act="svg">הורד קובץ חיתוך</button>
    </div>
  </section>
  <section class="controls" id="controls"></section>
</main>

  const fit=(a,b)=>({c:Math.max(0,Math.floor((U.w+g)/(a+g))),r:Math.max(0,Math.floor((U.h+g)/(b+g)))});
  const A=fit(w,h);let best={n:A.c*A.r,rot:0,c:A.c,r:A.r,cw:w,ch:h};
  if(allowRot){const B=fit(h,w);if(B.c*B.r>best.n)best={n:B.c*B.r,rot:90,c:B.c,r:B.r,cw:h,ch:w};}
  const totW=best.c*best.cw+(best.c-1)*g,totH=best.r*best.ch+(best.r-1)*g;
  const x0=U.x+(U.w-totW)/2,y0=U.y+(U.h-totH)/2,slots=[];
  for(let r=0;r<best.r;r++)for(let c=0;c<best.c;c++)slots.push({X:x0+(best.c-1-c)*(best.cw+g),Y:y0+r*(best.ch+g)}); // מימין לשמאל
  return{slots,rot:best.rot,n:best.n,cw:best.cw,ch:best.ch};
}
// items: [{w,h,pts?,segs?,folds?,draw(ctx,ppMm)}] באותו גודל. backs: פונקציה שמחזירה פריט גב לכל פריט, או null.
function paginate(items,{allowRot=true,backs=null,label='פנים',backLabel='גב'}={}){
  if(!items.length)return{pages:[],perPage:0};
  const L=gridSlots(items[0].w,items[0].h,allowRot);
  if(!L.n)return{pages:[],perPage:0,tooBig:true};
  const pages=[];
  for(let i=0;i<items.length;i+=L.n){
    const chunk=items.slice(i,i+L.n),k=pages.filter(p=>p.kind==='front').length+1;
    const place=(it,j,mirror)=>{const s=L.slots[j];const pw=L.cw;return{X:mirror?A4.w-s.X-pw:s.X,Y:s.Y,rot:L.rot,item:it};};
    pages.push({kind:'front',label:label+' '+k,cut:true,placed:chunk.map((it,j)=>place(it,j,false))});
    if(backs)pages.push({kind:'back',label:backLabel+' '+k,cut:false,placed:chunk.map((it,j)=>place(backs(it,i+j),j,true))});
  }
  return{pages,perPage:L.n};
}
// אריזה מעורבת — פריטים בגדלים שונים (קבוצות מדבקות). שורות מימין לשמאל, קבוצה חדשה מתחילה שורה חדשה.
function packMixed(items,{label='גיליון'}={}){
  const U=usable(),g=G.gap,pages=[];let page=null,x=0,y=0,rowH=0,lastGroup=null,skipped=0;
  const newPage=()=>{page={kind:'front',label:label+' '+(pages.length+1),cut:true,placed:[]};pages.push(page);x=0;y=0;rowH=0;};
  for(const it of items){const rot=it.prefRot||0,pw=rot?it.h:it.w,ph=rot?it.w:it.h;
    if(pw>U.w||ph>U.h){skipped++;continue;}
    if(!page)newPage();
    if(x>0&&(x+pw>U.w||it.group!==lastGroup)){y+=rowH+g;x=0;rowH=0;}
    if(y+ph>U.h){newPage();}
    page.placed.push({X:U.x+U.w-x-pw,Y:U.y+y,rot,item:it});x+=pw+g;rowH=Math.max(rowH,ph);lastGroup=it.group;}
  return{pages,skipped};
}
function toPage(p,x,y){ // נקודה מקומית של פריט → קואורדינטת דף
  const it=p.item;if(p.rot===90)return[p.X+(it.h-y),p.Y+x];return[p.X+x,p.Y+y];}
function applyPlace(ctx,p){ctx.translate(p.rot===90?p.X+p.item.h:p.X,p.Y);if(p.rot===90)ctx.rotate(Math.PI/2);}
function pathOf(pts){const p=new Path2D();pts.forEach((q,i)=>i?p.lineTo(q[0],q[1]):p.moveTo(q[0],q[1]));p.closePath();return p;}

function drawRegMarks(ctx){
  const r=G.reg,W=A4.w,H=A4.h,i=r.inset,l=r.length;
  ctx.save();ctx.fillStyle='#000';ctx.strokeStyle='#000';ctx.lineWidth=r.thickness;
  ctx.fillRect(i,i,r.square,r.square);
  ctx.beginPath();ctx.moveTo(W-i,i);ctx.lineTo(W-i-l,i);ctx.moveTo(W-i,i);ctx.lineTo(W-i,i+l);ctx.stroke();
  ctx.beginPath();ctx.moveTo(i,H-i);ctx.lineTo(i+l,H-i);ctx.moveTo(i,H-i);ctx.lineTo(i,H-i-l);ctx.stroke();
  if(r.count>=4){ctx.beginPath();ctx.moveTo(W-i,H-i);ctx.lineTo(W-i-l,H-i);ctx.moveTo(W-i,H-i);ctx.lineTo(W-i,H-i-l);ctx.stroke();}
  ctx.restore();
}
function drawCropMarks(ctx,page){ // חיתוך ידני: סימני חיתוך בשוליים, בהמשך לקצוות העמודות והשורות
  const xs=new Set(),ys=new Set();let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
  page.placed.forEach(p=>{const w=p.rot===90?p.item.h:p.item.w,h=p.rot===90?p.item.w:p.item.h;
    xs.add(+p.X.toFixed(2));xs.add(+(p.X+w).toFixed(2));ys.add(+p.Y.toFixed(2));ys.add(+(p.Y+h).toFixed(2));
    minX=Math.min(minX,p.X);maxX=Math.max(maxX,p.X+w);minY=Math.min(minY,p.Y);maxY=Math.max(maxY,p.Y+h);});
  ctx.save();ctx.strokeStyle='#000';ctx.lineWidth=.15;ctx.beginPath();
  xs.forEach(x=>{ctx.moveTo(x,minY-2);ctx.lineTo(x,minY-6);ctx.moveTo(x,maxY+2);ctx.lineTo(x,maxY+6);});
  ys.forEach(y=>{ctx.moveTo(minX-2,y);ctx.lineTo(minX-6,y);ctx.moveTo(maxX+2,y);ctx.lineTo(maxX+6,y);});
  ctx.stroke();ctx.restore();
}
function drawPage(ctx,page,ppMm,{print=false}={}){
  ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#fff';ctx.fillRect(0,0,ctx.canvas.width,ctx.canvas.height);
  ctx.scale(ppMm,ppMm);
  if(page.cut&&G.mode==='silhouette')drawRegMarks(ctx);
  if(G.mode==='manual'&&page.placed.length)drawCropMarks(ctx,page);
  for(const p of page.placed){
    ctx.save();applyPlace(ctx,p);p.item.draw(ctx,ppMm);ctx.restore();
    const guide=print?G.printGuide:(G.showCut&&page.cut);
    if(guide){ctx.save();applyPlace(ctx,p);ctx.strokeStyle=print?'#9CA3AF':'#E23B2E';ctx.lineWidth=print?.15:Math.max(.25,1/ppMm);
      if(!print)ctx.setLineDash([1.2,.8]);
      if(p.item.pts)ctx.stroke(pathOf(p.item.pts));
      if(p.item.segs){ctx.beginPath();p.item.segs.forEach(s=>s.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1])));ctx.stroke();}
      ctx.restore();}
  }
  ctx.restore();
}
function cutSvg(page){
  const f=n=>+n.toFixed(3);let cut='',fold='';
  for(const p of page.placed){const it=p.item;
    if(it.pts){cut+='    <path d="'+it.pts.map((q,i)=>{const P=toPage(p,q[0],q[1]);return(i?'L':'M')+f(P[0])+' '+f(P[1]);}).join(' ')+' Z"/>\n';}
    if(it.segs)it.segs.forEach(s=>{cut+='    <path d="'+s.map((q,i)=>{const P=toPage(p,q[0],q[1]);return(i?'L':'M')+f(P[0])+' '+f(P[1]);}).join(' ')+'"/>\n';});
    if(it.folds)it.folds.forEach(s=>{const a=toPage(p,...s[0]),b=toPage(p,...s[1]);fold+=`    <path d="M${f(a[0])} ${f(a[1])} L${f(b[0])} ${f(b[1])}"/>\n`;});
  }
  let svg=`<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297">\n  <!-- אדום = חיתוך${fold?'. כחול = קו קיפול (להגדיר ב-Studio כחירור/סימון לפי צבע)':''} -->\n  <g stroke="#ff0000" stroke-width="0.1" fill="none">\n${cut}  </g>\n`;
  if(fold)svg+=`  <g stroke="#0000ff" stroke-width="0.1" fill="none">\n${fold}  </g>\n`;
  return svg+'</svg>\n';
}

const SHAPES={
  rect:{he:'מלבן'},rounded:{he:'מעוגל'},circle:{he:'עיגול'},oval:{he:'אליפסה'},banner:{he:'סרט'},
  heart:{he:'לב'},star:{he:'כוכב'},hex:{he:'משושה'},cloud:{he:'ענן'}

function shapePts(shape,w,h,r=3){

    case 'rect':return[[0,0],[w,0],[w,h],[0,h]];
    case 'rounded':{const q=Math.max(0,Math.min(r,w/2,h/2));if(q<.05)return shapePts('rect',w,h);
      ell(w-q,q,q,q,-Math.PI/2,0,10);ell(w-q,h-q,q,q,0,Math.PI/2,10);ell(q,h-q,q,q,Math.PI/2,Math.PI,10);ell(q,q,q,q,Math.PI,Math.PI*1.5,10);P.pop();return P;}
    case 'circle':case 'oval':{const rx=w/2,ry=shape==='circle'?Math.min(w,h)/2:h/2;ell(w/2,h/2,shape==='circle'?Math.min(w,h)/2:rx,ry,0,Math.PI*2,120);P.pop();return P;}
    case 'banner':{const d=Math.min(h*.32,w*.2);return[[0,0],[w,0],[w-d,h/2],[w,h],[0,h],[d,h/2]];}
    case 'hex':return[[w*.25,0],[w*.75,0],[w,h/2],[w*.75,h],[w*.25,h],[0,h/2]];
    case 'star':{for(let i=0;i<10;i++){const rr=i%2?.45:1,a=-Math.PI/2+i*Math.PI/5;P.push([Math.cos(a)*rr,Math.sin(a)*rr]);}return fitBox(P,w,h);}

function fitBox(P,w,h){const xs=P.map(p=>p[0]),ys=P.map(p=>p[1]),x0=Math.min(...xs),y0=Math.min(...ys),sx=w/(Math.max(...xs)-x0),sy=h/(Math.max(...ys)-y0);return P.map(p=>[(p[0]-x0)*sx,(p[1]-y0)*sy]);}
function insetPts(shape,w,h,r,i){ // קו פנימי במרחק i — אמיתי למלבנים/עיגולים, קירוב לשאר
  if(['rect','rounded','circle','oval'].includes(shape))return shapePts(shape,Math.max(1,w-2*i),Math.max(1,h-2*i),Math.max(0,r-i)).map(p=>[p[0]+i,p[1]+i]);
  const s=Math.max(.05,1-2*i/Math.min(w,h));return shapePts(shape,w,h,r).map(p=>[w/2+(p[0]-w/2)*s,h/2+(p[1]-h/2)*s]);

function resample(P,n){ // n נקודות במרווחים שווים לאורך ההיקף
  const segs=[];let tot=0;for(let i=0;i<P.length;i++){const a=P[i],b=P[(i+1)%P.length],l=Math.hypot(b[0]-a[0],b[1]-a[1]);segs.push([a,b,l]);tot+=l;}
  const out=[];let k=0,acc=0;for(let j=0;j<n;j++){const t=j*tot/n;while(k<segs.length-1&&acc+segs[k][2]<t){acc+=segs[k][2];k++;}const [a,b,l]=segs[k],u=l?(t-acc)/l:0;out.push([a[0]+(b[0]-a[0])*u,a[1]+(b[1]-a[1])*u]);}
  return{pts:out,len:tot};

// ═══════════ עיצוב רקע/גב (נלמד מעורך הגב של הדאבל) ═══════════
function sr(s){const x=Math.sin(s)*10000;return x-Math.floor(x);}
function defDeco(o={}){const d={bg:{mode:'solid',c1:'#FFFFFF',c2:'#FFFFFF'},pattern:{id:'none',color:'#000000',op:15,scale:100},frame:{id:'none',color:'#14294D',w:1.2,op:100},symbol:{id:'none',color:'#FFFFFF',size:40,op:100,dy:0},text:{main:"",sub:"",font:"Rubik",color:"#FFFFFF",size:24,dy:0}};
  for(const k in o)d[k]=Object.assign({},d[k],o[k]);return d;}
function presetDeco(id){const p=window.BackAssets&&BackAssets.PRESETS.find(x=>x.id===id);if(!p)return defDeco({bg:{mode:'radial',c1:'#1F3A68',c2:'#14294D'},frame:{id:'double',color:'#C6A135',w:1.4},symbol:{id:'star',color:'#C6A135',size:42}});
  const v=p.apply();if(v.text)v.text.font=fam(v.text.font);return defDeco(v);}
const PATTERN_IDS=[['none','ללא'],['dots','נקודות'],['stripes','פסים'],['checker','משבצות'],['confetti','קונפטי'],['stars','כוכבונים'],['grid','רשת'],['waves','גלים']];
const FRAME_IDS=[['none','ללא'],['single','קו יחיד'],['double','קו כפול'],['dashed','מקווקו'],['beads','חרוזים'],['scallop','גלי'],['zigzag','זיגזג'],['corners','פינות']];
const _tiles={};
function patternTile(p,mm,ppMm){
  const szPx=Math.max(8,Math.round(mm*ppMm)),key=[p.id,p.color,szPx].join('|');if(_tiles[key])return _tiles[key];
  const t=document.createElement('canvas');t.width=t.height=szPx;const c=t.getContext('2d'),sz=szPx;c.fillStyle=p.color;c.strokeStyle=p.color;
  switch(p.id){
    case 'dots':c.beginPath();c.arc(sz*.25,sz*.25,sz*.1,0,7);c.fill();c.beginPath();c.arc(sz*.75,sz*.75,sz*.1,0,7);c.fill();break;
    case 'stripes':c.fillRect(0,0,sz*.5,sz);break;
    case 'checker':c.fillRect(0,0,sz*.5,sz*.5);c.fillRect(sz*.5,sz*.5,sz*.5,sz*.5);break;
    case 'confetti':for(let i=0;i<9;i++){const s=7777+i*17,rr=sz*(.05+sr(s+5)*.06);c.save();c.translate(sr(s)*sz,sr(s+3)*sz);c.rotate(sr(s+7)*6.28);c.fillRect(-rr,-rr*.4,rr*2,rr*.8);c.restore();}break;
    case 'stars':c.beginPath();for(let i=0;i<10;i++){const rr=i%2?sz*.1:sz*.22,a=-Math.PI/2+i*Math.PI/5;c.lineTo(sz*.5+Math.cos(a)*rr,sz*.5+Math.sin(a)*rr);}c.closePath();c.fill();break;
    case 'grid':c.lineWidth=Math.max(1,sz*.05);c.strokeRect(0,0,sz,sz);break;
    case 'waves':c.lineWidth=Math.max(1,sz*.07);c.beginPath();c.moveTo(0,sz*.5);c.bezierCurveTo(sz*.25,sz*.15,sz*.25,sz*.85,sz*.5,sz*.5);c.bezierCurveTo(sz*.75,sz*.15,sz*.75,sz*.85,sz,sz*.5);c.stroke();break;

function drawDeco(ctx,shape,w,h,r,deco,ppMm,{noText=false}={}){
  const pts=shapePts(shape,w,h,r),clip=pathOf(pts),R=Math.min(w,h)/2;
  ctx.save();ctx.clip(clip);
  const b=deco.bg;let fill=b.c1;
  if(b.mode==='radial'){fill=ctx.createRadialGradient(w/2,h/2,0,w/2,h/2,Math.max(w,h)/2);fill.addColorStop(0,b.c1);fill.addColorStop(1,b.c2);}
  else if(b.mode==='diag'){fill=ctx.createLinearGradient(0,0,w,h);fill.addColorStop(0,b.c1);fill.addColorStop(1,b.c2);}
  ctx.fillStyle=fill;ctx.fillRect(0,0,w,h);

  if(pt.id!=='none'&&pt.op>0){const mm=Math.max(2,R*.2*pt.scale/100),pat=ctx.createPattern(patternTile(pt,mm,ppMm),'repeat');
    pat.setTransform(new DOMMatrix().scale(1/ppMm));ctx.globalAlpha=pt.op/100;ctx.fillStyle=pat;ctx.fillRect(0,0,w,h);ctx.globalAlpha=1;}
  drawFrame(ctx,shape,w,h,r,deco.frame);

  if(sym&&sy.op>0){const s=R*sy.size/100;ctx.save();ctx.translate(w/2,h/2+R*sy.dy/100);ctx.scale(s,s);ctx.fillStyle=sy.color;ctx.strokeStyle=sy.color;ctx.globalAlpha=sy.op/100;ctx.lineWidth=.08;sym.draw(ctx);ctx.restore();}
  if(!noText&&deco.text.main){const t=deco.text;ctx.save();ctx.textAlign='center';ctx.textBaseline='middle';ctx.direction='rtl';
    const fs=Math.max(1,R*t.size/100);ctx.font=`800 ${fs}px "${fam(t.font)}", Rubik, sans-serif`;ctx.lineWidth=fs*.06;ctx.strokeStyle='rgba(0,0,0,.3)';
    const y=h/2+R*t.dy/100;ctx.strokeText(t.main,w/2,y);ctx.fillStyle=t.color;ctx.fillText(t.main,w/2,y);ctx.restore();}
  ctx.restore();

function drawFrame(ctx,shape,w,h,r,fr){

    case 'single':ctx.lineWidth=fw;ctx.stroke(ring(fw/2+.4));break;
    case 'double':{const s=Math.max(.3,fw/3);ctx.lineWidth=s;ctx.stroke(ring(s/2+.4));ctx.stroke(ring(s*2.6+.4));break;}
    case 'dashed':ctx.lineWidth=fw;ctx.setLineDash([fw*2.4,fw*1.7]);ctx.stroke(ring(fw/2+.4));break;

    case 'scallop':{const base=insetPts(shape,w,h,r,fw*.9+.4),n=Math.max(10,Math.round(resample(base,40).len/(fw*1.9)));ctx.lineWidth=Math.max(.2,fw*.35);resample(base,n).pts.forEach(p=>{ctx.beginPath();ctx.arc(p[0],p[1],fw*.9,0,7);ctx.stroke();});break;}
    case 'zigzag':{const A=insetPts(shape,w,h,r,fw*.35+.3),B=insetPts(shape,w,h,r,fw*1.6+.3),n=Math.max(14,Math.round(resample(A,40).len/(fw*2)))&~1;
      const a=resample(A,n).pts,b=resample(B,n).pts;ctx.lineWidth=Math.max(.2,fw*.4);ctx.beginPath();for(let i=0;i<n;i++){const q=i%2?b[i]:a[i];i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]);}ctx.closePath();ctx.stroke();break;}

function fitText(ctx,text,family,weight,maxW,maxH,maxLines=2){
  const words=String(text).trim().split(/\s+/);let size=maxH;
  for(let it=0;it<60;it++){ctx.font=`${weight} ${size}px "${fam(family)}", Rubik, sans-serif`;
    const lines=[];let cur='';for(const w of words){const t=cur?cur+' '+w:w;if(ctx.measureText(t).width<=maxW||!cur)cur=t;else{lines.push(cur);cur=w;}}if(cur)lines.push(cur);
    const wide=lines.some(l=>ctx.measureText(l).width>maxW);
    if(!wide&&lines.length<=maxLines&&lines.length*size*1.08<=maxH)return{lines,size};size*=.93;}
  return{lines:[String(text)],size};
}
function drawTextBox(ctx,text,{family='Rubik',weight=800,color='#14294D',outline=null,x,y,w,h,maxLines=2,dir='rtl'}){
  if(!String(text||'').trim())return;const F=fitText(ctx,text,family,weight,w,h,maxLines);

    const wa=`שלום הושעיה, שלחתי הזמנה מהסטודיו. מספר הזמנה: ${j.code}. ${cur.label}, ${j.price} ₪.`;

    oBody().append(el('p',{class:'hint'},'מספר הזמנה'),el('div',{class:'big',dir:'ltr'},j.code),el('div',{class:'price'},j.price+' ₪'),
      el('p',{class:'hint'},'שלחו לי הודעה בוואטסאפ עם מספר ההזמנה ואחזור אליכם לתשלום ולמועד האיסוף.'),
      el('a',{class:'btn gold',style:'text-align:center;text-decoration:none',href:`https://wa.me/${ORDER_WA}?text=${encodeURIComponent(wa)}`,target:'_blank',rel:'noopener'},'שליחת הודעה בוואטסאפ'),
      el('button',{type:'button',class:'btn ghost',on:{click:closeOrder}},'חזרה לעיצוב'));
  }catch(e){console.error(e);err.textContent=ERR[e.message]||ERR.network;btn.disabled=false;btn.textContent='שלח הזמנה';}
}
// ── מנהל ──
function setAdmin(on){isAdmin=on;document.body.classList.toggle('admin',on);document.getElementById('ver').innerHTML='';document.getElementById('ver').append(VERSION,on?el('span',{class:'adminbadge',style:'margin-inline-start:8px'},'מנהל'):'');
  if(!on&&cur.id==='admin')cur=Stickers;buildTabs();rebuild();}
function openLogin(){document.getElementById('loginModal').hidden=false;document.getElementById('loginEmail').focus();}
async function sendLogin(){const em=document.getElementById('loginEmail').value.trim(),msg=document.getElementById('loginMsg');if(!sb){msg.textContent='החיבור לשרת לא נטען';return;}
  const {error}=await sb.auth.signInWithOtp({email:em,options:{shouldCreateUser:false,emailRedirectTo:location.href.split('#')[0]}});
  msg.textContent=error?(error.status===429||/rate|seconds/i.test(error.message||'')?'נשלח כבר קישור לפני רגע — חכו דקה ונסו שוב, או השתמשו בקישור האחרון שהגיע':'לא ניתן לשלוח קישור לכתובת הזו')
    :'נשלח קישור. לוחצים עליו פעם אחת בלבד (הוא חד-פעמי), וחוזרים לכאן — הכניסה תזוהה לבד.';}
const STATUS_HE={uploading:'העלאה לא הושלמה',new:'חדשה',in_progress:'בעבודה',done:'הודפסה',cancelled:'בוטלה'},PROD_HE={stickers:'מדבקות',cards:'קלפים',memory:'זיכרון',domino:'דומינו',dice:'קוביות',puzzle:'פאזל'};
// פתיחת הזמנה בסטודיו: מורידים את design.zip ופותחים אותו כמו "פתיחת עיצוב מקובץ" — ואז המנהל בוחר פורמט
async function openOrderDesign(o){toast('טוען את הזמנה '+o.code+'…');
  try{const {data:blob,error:e}=await withTimeout(sb.storage.from('studio-orders').download(o.id+'/design.zip'),60000,'timeout');
    if(e||!blob){toast('קובץ העיצוב לא נמצא');return;}await importDesignZip(blob,o.code);}
  catch(e){toast(e.message==='timeout'?'הטעינה לוקחת יותר מדי זמן — נסו שוב':'הפתיחה נכשלה — נסו שוב');}}
function ordersSection(){
  const list=el('div',{class:'olist'},el('p',{class:'hint'},'טוען הזמנות…'));
  const load=async()=>{if(!sb){list.innerHTML='';return;}
    const {data,error}=await sb.from('studio_orders').select('*').order('created_at',{ascending:false}).limit(60);
    list.innerHTML='';if(error){list.append(el('p',{class:'err'},'שגיאה בטעינה: '+error.message));return;}
    if(!data.length){list.append(el('p',{class:'hint'},'אין עדיין הזמנות.'));return;}
    data.forEach(o=>{// v0.18: מורידים את הקובץ לזיכרון ושומרים כמו כל הורדה אחרת באפליקציה. קודם: location.href לקישור חתום —
      // באפליקציה המותקנת באנדרואיד השרת החזיר 200 אבל לא הופיע כלום על המסך.
      const dl=async n=>{const name=o.code+'-'+n;toast('מוריד '+name+'…');
        try{const {data:blob,error:e}=await withTimeout(sb.storage.from('studio-orders').download(o.id+'/'+n),60000,'timeout');
          if(e||!blob){toast('הקובץ לא נמצא');return;}download(blob,name);toast('נשמר בהורדות: '+name);}
        catch(e){toast(e.message==='timeout'?'ההורדה לוקחת יותר מדי זמן — בדקו את החיבור ונסו שוב':'ההורדה נכשלה — נסו שוב');}};
      const upd=async patch=>{const {error:e}=await sb.from('studio_orders').update(patch).eq('id',o.id);if(e)toast('שגיאה: '+e.message);else load();};
      const d=new Date(o.created_at);
      list.append(el('div',{class:'oitem'},
        el('div',{class:'top'},el('b',{dir:'ltr'},o.code),el('span',{},PROD_HE[o.product]||o.product),el('span',{class:'st '+o.status},STATUS_HE[o.status]||o.status),o.paid?el('span',{class:'st done'},'שולם'):null,
          el('span',{class:'hint',style:'margin-inline-start:auto'},d.toLocaleDateString('he-IL')+' '+d.toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'}))),
        el('div',{},(o.customer_name||'ללא שם')+' · ',el('a',{href:'tel:'+o.customer_phone,dir:'ltr'},o.customer_phone),' · '+o.sheets+' דפים · '+o.price_ils+' ₪'),
        o.summary?el('div',{class:'hint'},o.summary):null,o.customer_note?el('div',{},'💬 '+o.customer_note):null,
        el('div',{class:'acts'},(o.files||[]).includes('design.zip')?el('button',{type:'button',class:'open',on:{click:()=>openOrderDesign(o)}},'✏️ פתח בסטודיו'):null,(o.files||[]).filter(n=>n!=='design.zip').map(n=>el('button',{type:'button',on:{click:()=>dl(n)}},n==='print.pdf'?'PDF הדפסה':n==='preview.jpg'?'תצוגה':'קובץ חיתוך')),
          el('button',{type:'button',on:{click:()=>upd({paid:!o.paid})}},o.paid?'בטל שולם':'סמן שולם'),
          o.status!=='done'?el('button',{type:'button',on:{click:()=>upd({status:'done',printed:true})}},'סמן הודפס'):null,
          el('a',{href:`https://wa.me/972${o.customer_phone.slice(1)}?text=${encodeURIComponent('שלום, לגבי הזמנה '+o.code)}`,target:'_blank',rel:'noopener'},'וואטסאפ'))));});};
  load();
  return sec('הזמנות מהסטודיו',true,el('div',{class:'inline'},el('button',{type:'button',class:'btn ghost',on:{click:load}},'רענון'),
    el('a',{class:'btn ghost',href:'https://www.hoshaya.co.il/stickers-admin.html',target:'_blank',rel:'noopener',style:'text-decoration:none'},'הזמנות מדבקות (הישן)'),
    el('button',{type:'button',class:'btn ghost',on:{click:async()=>{await sb.auth.signOut();setAdmin(false);}}},'יציאה')),list);
}

(async function init(){
  document.getElementById('ver').textContent=VERSION;
  document.getElementById('fontClose').onclick=closeFontGallery;document.getElementById('fontModal').addEventListener('click',e=>{if(e.target.id==='fontModal')closeFontGallery();});document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeFontGallery();closeOrder();document.getElementById('loginModal').hidden=true;}});
  await Promise.all([loadShared('hebrew-fonts.js'),loadShared('back-assets.js')]);
  document.getElementById('orderClose').onclick=closeOrder;document.getElementById('loginClose').onclick=()=>document.getElementById('loginModal').hidden=true;document.getElementById('loginSend').onclick=sendLogin;
  makeStates();restore();if(cur.id==='admin')cur=Stickers;
  buildTabs();sizeCanvas();rebuild();
  if(cuUsesIco())loadCardIcons().then(()=>rebuild()).catch(()=>{});
  loadImages().then(n=>{if(n){rebuild();toast(n===1?'התמונה שלכם נטענה מחדש':n+' תמונות נטענו מחדש');}});
  // כניסה מקישור במייל: באנדרואיד הקישור נפתח לפעמים בכרום, והאפליקציה המותקנת (שכבר פתוחה) לא יודעת על זה —
  // האחסון משותף, אז בודקים שוב בכל חזרה לחלון. קישור שכבר שומש/פג חוזר עם #error — מציגים הסבר במקום שקט.
  if(sb){const apply=sess=>{const em=(sess?.user?.email||'').toLowerCase();if((em===ADMIN_EMAIL)!==isAdmin){setAdmin(em===ADMIN_EMAIL);if(em===ADMIN_EMAIL)toast('נכנסת כמנהל');}};
    const chk=async()=>{try{const {data}=await sb.auth.getSession();apply(data.session);}catch(e){}};
    // כשהאפליקציה כבר פתוחה, אנדרואיד מעביר אליה את הקישור כשינוי של ה-# בלבד — בלי טעינה מחדש,
    // ו-Supabase קורא את ה-# רק בטעינה (בטעינה הוא מטפל לבד). לכן מטפלים בו גם ב-hashchange (v0.17).
    const authHash=async(first)=>{const h=new URLSearchParams(location.hash.slice(1));const clean=()=>history.replaceState(null,'',location.pathname+location.search);
      if(h.get('error_code')||h.get('error')){toast(h.get('error_code')==='otp_expired'?'הקישור כבר שומש או שפג תוקפו — שלחו קישור חדש':'הכניסה לא הצליחה — שלחו קישור חדש');clean();return;}
      if(!first&&h.get('access_token')&&h.get('refresh_token')){try{const {error}=await sb.auth.setSession({access_token:h.get('access_token'),refresh_token:h.get('refresh_token')});if(error)toast('הכניסה לא הצליחה — שלחו קישור חדש');}catch(e){}clean();}};
    authHash(true);addEventListener('hashchange',()=>authHash(false));
    chk();sb.auth.onAuthStateChange((ev,sess)=>apply(sess)); // לא לקרוא ל-getSession כאן — נתקע על המנעול של supabase-js
    addEventListener('visibilitychange',()=>{if(!document.hidden)chk();});addEventListener('focus',chk);
    addEventListener('storage',e=>{if(!e.key||e.key.startsWith('sb-'))chk();});}
  new ResizeObserver(()=>{sizeCanvas();drawPreview();}).observe(cv.parentElement);
  document.fonts.ready.then(rerender);[ST.font,'Secular One'].forEach(f=>loadFont(f).then(rerender));
})();
</script>
